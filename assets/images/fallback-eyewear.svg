<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5" />
      <stop offset="50%" stop-color="#F4EFEA" />
      <stop offset="100%" stop-color="#E8DFD5" />
    </linearGradient>
    <linearGradient id="frameCopper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97736" />
      <stop offset="100%" stop-color="#C86228" />
    </linearGradient>
    <linearGradient id="lensReflect" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.25)" />
      <stop offset="40%" stop-color="rgba(255, 255, 255, 0.4)" />
      <stop offset="100%" stop-color="rgba(56, 189, 248, 0.05)" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="rgba(11, 19, 37, 0.15)" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgGrad)" />
  <circle cx="300" cy="180" r="140" fill="rgba(255, 255, 255, 0.6)" />

  <!-- Eyewear Graphic -->
  <g filter="url(#softShadow)" transform="translate(0, -10)">
    <!-- Right Lens Frame -->
    <rect x="145" y="125" width="125" height="100" rx="20" fill="url(#lensReflect)" stroke="url(#frameCopper)" stroke-width="7" />
    <path d="M155 140 L195 140" stroke="rgba(255,255,255,0.7)" stroke-width="3" stroke-linecap="round" />
    
    <!-- Left Lens Frame -->
    <rect x="330" y="125" width="125" height="100" rx="20" fill="url(#lensReflect)" stroke="url(#frameCopper)" stroke-width="7" />
    <path d="M340 140 L380 140" stroke="rgba(255,255,255,0.7)" stroke-width="3" stroke-linecap="round" />

    <!-- Bridge Arch -->
    <path d="M270 160 C285 145, 315 145, 330 160" fill="none" stroke="url(#frameCopper)" stroke-width="6" stroke-linecap="round" />
    
    <!-- Left & Right Temples -->
    <path d="M145 155 L105 135" fill="none" stroke="url(#frameCopper)" stroke-width="5" stroke-linecap="round" />
    <path d="M455 155 L495 135" fill="none" stroke="url(#frameCopper)" stroke-width="5" stroke-linecap="round" />

    <!-- Screwless Hinge Details -->
    <circle cx="145" cy="155" r="3" fill="#111E38" />
    <circle cx="455" cy="155" r="3" fill="#111E38" />
  </g>

  <!-- FrameLab Branding Text -->
  <g text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif">
    <text x="300" y="295" font-size="20" font-weight="800" letter-spacing="-0.5" fill="#0B1325">FrameLab</text>
    <text x="300" y="320" font-size="10" font-weight="600" letter-spacing="3" fill="#D97736">HAUTE EYEWEAR &bull; CURATED EDITION</text>
    <text x="300" y="345" font-size="9" font-family="'Fira Code', monospace" fill="#6B7280">ISO 8624 &bull; PRECISION OPTICS</text>
  </g>
</svg>
